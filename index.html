<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лови Драже!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Fredoka+One&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a0a2e;
    font-family: 'Fredoka One', 'Russo One', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    position: fixed;
  }

  #game-container {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 30%, #3d1f6d 60%, #4a2080 100%);
  }

  .bg-element { position: absolute; pointer-events: none; z-index: 0; }

  .moon {
    width: clamp(50px, 10vw, 120px);
    height: clamp(50px, 10vw, 120px);
    background: radial-gradient(circle, #fff9c4 0%, #ffe082 50%, #ffb74d 100%);
    border-radius: 50%;
    top: 5%; right: 5%;
    box-shadow: 0 0 60px rgba(255, 224, 130, 0.5), 0 0 120px rgba(255, 183, 77, 0.3);
    z-index: 1;
  }

  .bat {
    position: absolute;
    font-size: clamp(16px, 3vw, 30px);
    animation: batFly 8s ease-in-out infinite;
    z-index: 1;
    filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
  }

  @keyframes batFly {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(30px, -20px) rotate(5deg); }
    50% { transform: translate(60px, 10px) rotate(-3deg); }
    75% { transform: translate(20px, -10px) rotate(2deg); }
  }

  .stars { position: absolute; width: 100%; height: 50%; top: 0; z-index: 1; }

  .star {
    position: absolute;
    width: 3px; height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s ease-in-out infinite;
  }

  @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .web-container { position: absolute; pointer-events: none; z-index: 2; opacity: 0.3; }
  .web-container svg { width: 100%; height: 100%; }
  .web-container svg path, .web-container svg line { stroke: rgba(255, 255, 255, 0.7); fill: none; stroke-width: 1; }

  .web-tl { top: 0; left: 0; width: clamp(80px, 15vw, 220px); height: clamp(80px, 15vw, 220px); }
  .web-tr { top: 0; right: 0; width: clamp(80px, 15vw, 220px); height: clamp(80px, 15vw, 220px); transform: scaleX(-1); }
  .web-bl { bottom: 0; left: 0; width: clamp(60px, 12vw, 180px); height: clamp(60px, 12vw, 180px); transform: scaleY(-1); }
  .web-br { bottom: 0; right: 0; width: clamp(60px, 12vw, 180px); height: clamp(60px, 12vw, 180px); transform: scale(-1, -1); }
  .web-ml { top: 45%; left: 0; width: clamp(50px, 10vw, 140px); height: clamp(50px, 10vw, 140px); }
  .web-mr { top: 45%; right: 0; width: clamp(50px, 10vw, 140px); height: clamp(50px, 10vw, 140px); transform: scaleX(-1); }

  .spider {
    position: absolute;
    font-size: clamp(12px, 2.5vw, 22px);
    z-index: 3;
    animation: spiderDangle 4s ease-in-out infinite;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }

  @keyframes spiderDangle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(8px) rotate(5deg); }
    50% { transform: translateY(3px) rotate(-3deg); }
    75% { transform: translateY(10px) rotate(2deg); }
  }

  .spider-thread { position: absolute; width: 1px; background: rgba(255,255,255,0.3); z-index: 2; }

  #ui-top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: clamp(4px, 1vh, 10px) clamp(6px, 1.5vw, 12px);
    z-index: 100; gap: 6px;
  }

  .score-panel, .progress-panel {
    background: linear-gradient(135deg, #4a1a6b, #6b2fa0);
    border: 2px solid #ff8c00;
    border-radius: 10px;
    padding: clamp(4px, 0.8vh, 8px) clamp(6px, 1.5vw, 14px);
    color: white; text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    flex: 0 0 auto; min-width: 0;
  }

  .score-panel .label, .progress-panel .label {
    font-size: clamp(9px, 2vw, 13px);
    color: #ffb74d; text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    white-space: nowrap;
  }

  .score-panel .label .pumpkin-icon, .progress-panel .label .pumpkin-icon {
    font-size: clamp(12px, 2.5vw, 20px);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    animation: pumpkinBob 2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pumpkinBob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-2px) rotate(3deg); }
  }

  .score-panel .value {
    font-size: clamp(18px, 4vw, 32px);
    color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    line-height: 1.1;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    white-space: nowrap;
  }

  .score-panel .value .pumpkin-big {
    font-size: clamp(14px, 3vw, 26px);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    flex-shrink: 0;
  }

  .progress-bar-container {
    width: 100%; height: clamp(8px, 1.5vh, 14px);
    background: #2d1b4e; border-radius: 6px;
    margin-top: 3px; overflow: hidden; border: 2px solid #ff8c00;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4caf50, #8bc34a, #cddc39);
    border-radius: 4px; transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
  }

  .progress-text {
    font-size: clamp(11px, 2.5vw, 16px);
    color: #fff; margin-top: 2px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    white-space: nowrap;
  }

  .progress-text .pumpkin-small {
    font-size: clamp(12px, 2.5vw, 18px);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    flex-shrink: 0;
  }

  #game-title {
    position: absolute;
    top: clamp(40px, 8vh, 60px);
    left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 99; pointer-events: none;
  }

  #game-title h1 {
    font-family: 'Russo One', 'Fredoka One', sans-serif;
    font-size: clamp(18px, 5vw, 42px);
    color: #ff8c00;
    text-shadow: 3px 3px 0 #4a1a6b, -1px -1px 0 #4a1a6b, 1px -1px 0 #4a1a6b, -1px 1px 0 #4a1a6b, 0 4px 8px rgba(0,0,0,0.5);
    letter-spacing: 2px; white-space: nowrap;
  }

  #character {
    position: absolute;
    bottom: clamp(80px, 14vh, 130px);
    width: clamp(70px, 16vw, 140px);
    height: clamp(85px, 19vw, 160px);
    z-index: 50;
    transition: left 0.08s ease-out;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
  }

  .character-svg { width: 100%; height: 100%; }

  #character.caught { animation: catchBounce 0.4s ease; }
  #character.missed { animation: missShake 0.4s ease; }

  @keyframes catchBounce {
    0% { transform: scale(1); }
    30% { transform: scale(1.2) translateY(-10px); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  @keyframes missShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-3deg); }
    40% { transform: translateX(8px) rotate(3deg); }
    60% { transform: translateX(-5px) rotate(-2deg); }
    80% { transform: translateX(5px) rotate(2deg); }
  }

  .candy {
    position: absolute;
    width: clamp(22px, 4.5vw, 34px);
    height: clamp(22px, 4.5vw, 34px);
    border-radius: 50%;
    z-index: 40;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3), inset 0 -3px 6px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.3);
  }

  .candy::after {
    content: ''; position: absolute;
    top: 5px; left: 7px; width: 8px; height: 6px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%; transform: rotate(-30deg);
  }

  .candy.red { background: radial-gradient(circle at 35% 35%, #ff6b6b, #e53935, #b71c1c); }
  .candy.orange { background: radial-gradient(circle at 35% 35%, #ffb74d, #ff9800, #e65100); }
  .candy.yellow { background: radial-gradient(circle at 35% 35%, #fff176, #fdd835, #f9a825); }
  .candy.green { background: radial-gradient(circle at 35% 35%, #81c784, #4caf50, #2e7d32); }
  .candy.blue { background: radial-gradient(circle at 35% 35%, #64b5f6, #2196f3, #1565c0); }
  .candy.purple { background: radial-gradient(circle at 35% 35%, #ce93d8, #9c27b0, #6a1b9a); }
  .candy.pink { background: radial-gradient(circle at 35% 35%, #f48fb1, #e91e63, #ad1457); }

  .catch-effect { position: absolute; pointer-events: none; z-index: 60; animation: catchPop 0.6s ease forwards; }
  @keyframes catchPop { 0% { transform: scale(0.5); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.8; } 100% { transform: scale(2); opacity: 0; } }

  .catch-text {
    position: absolute;
    font-size: clamp(16px, 3.5vw, 26px); font-weight: bold;
    color: #4caf50; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    z-index: 65; pointer-events: none;
    animation: floatUp 0.8s ease forwards;
  }

  .miss-text {
    position: absolute;
    font-size: clamp(16px, 3.5vw, 26px); font-weight: bold;
    color: #f44336; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    z-index: 65; pointer-events: none;
    animation: floatUp 0.8s ease forwards;
  }

  @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.3); opacity: 0; } }

  .screen-flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 55; pointer-events: none; opacity: 0; }
  .screen-flash.green { background: radial-gradient(circle, rgba(76,175,80,0.3), transparent); animation: flashGreen 0.3s ease; }
  .screen-flash.red { background: radial-gradient(circle, rgba(244,67,54,0.3), transparent); animation: flashRed 0.3s ease; }
  @keyframes flashGreen { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }

  #controls {
    position: absolute;
    bottom: clamp(8px, 1.5vh, 12px);
    left: 50%; transform: translateX(-50%);
    display: flex; gap: clamp(5px, 1vw, 8px);
    z-index: 100; align-items: center;
  }

  .btn {
    background: linear-gradient(135deg, #6b2fa0, #4a1a6b);
    border: 2px solid #ff8c00; border-radius: 10px;
    color: white; font-family: 'Fredoka One', sans-serif;
    font-size: clamp(11px, 2.2vw, 15px);
    padding: clamp(5px, 1vh, 8px) clamp(8px, 2vw, 16px);
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.4); }

  .btn-icon {
    width: clamp(32px, 7vw, 42px); height: clamp(32px, 7vw, 42px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(14px, 3vw, 18px); padding: 0;
  }

  #mobile-controls {
    position: absolute;
    bottom: clamp(55px, 10vh, 90px);
    left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 clamp(8px, 2vw, 16px);
    z-index: 100; pointer-events: none;
  }

  .mobile-btn {
    width: clamp(48px, 12vw, 65px); height: clamp(48px, 12vw, 65px);
    border-radius: 50%;
    background: rgba(107, 47, 160, 0.75);
    border: 2px solid #ff8c00;
    color: white; font-size: clamp(20px, 5vw, 28px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }

  .mobile-btn:active { background: rgba(107, 47, 160, 0.95); transform: scale(0.9); }

  #overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 10, 46, 0.92);
    z-index: 200;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    padding: 20px;
  }

  #overlay.show { display: flex; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #overlay h2 {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(20px, 6vw, 46px);
    color: #ff8c00;
    text-shadow: 3px 3px 0 #4a1a6b, 0 4px 10px rgba(0,0,0,0.5);
    margin-bottom: 12px; text-align: center;
  }

  #overlay .result-text {
    font-size: clamp(14px, 3.5vw, 24px);
    color: #cddc39; margin-bottom: 20px; text-align: center; padding: 0 10px;
  }

  #overlay .btn { font-size: clamp(16px, 3.5vw, 20px); padding: 10px 24px; }

  /* СТАРТОВЫЙ ЭКРАН */
  #start-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 10, 46, 0.95);
    z-index: 300;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    padding: 20px;
  }

  #start-overlay.hidden { display: none !important; }

  #start-overlay h2 {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(24px, 7vw, 52px);
    color: #ff8c00;
    text-shadow: 3px 3px 0 #4a1a6b, 0 4px 10px rgba(0,0,0,0.5);
    margin-bottom: 25px; text-align: center;
  }

  .btn-start {
    background: linear-gradient(135deg, #4caf50, #8bc34a);
    border: 3px solid #ff8c00; border-radius: 15px;
    color: white; font-family: 'Fredoka One', sans-serif;
    font-size: clamp(18px, 4.5vw, 26px);
    padding: clamp(14px, 3vh, 20px) clamp(28px, 6vw, 45px);
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    transition: transform 0.1s;
    white-space: nowrap;
    animation: pulse 2s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .btn-start:active { transform: scale(0.95) !important; }

  #floor {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: clamp(30px, 6vh, 70px);
    background: linear-gradient(180deg, transparent, rgba(74, 26, 107, 0.5), rgba(45, 27, 78, 0.8));
    z-index: 10;
  }

  #floor::before {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ff8c00, #ffb74d, #ff8c00, transparent);
  }

  .ground-pumpkin {
    position: absolute; bottom: 3px;
    font-size: clamp(20px, 4.5vw, 38px);
    z-index: 11; opacity: 0.7;
  }

  .confetti {
    position: absolute; width: 8px; height: 8px; z-index: 150;
    animation: confettiFall 2s ease-in forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 480px) { .web-ml, .web-mr { display: none; } .bat { font-size: 14px; } }
  @media (max-width: 360px) { .score-panel, .progress-panel { padding: 3px 5px; } #game-title { top: 35px; } }
</style>
</head>
<body>

<div id="game-container">
  <div class="moon bg-element"></div>
  <div class="stars" id="stars"></div>

  <div class="web-container web-tl">
    <svg viewBox="0 0 200 200"><line x1="0" y1="0" x2="200" y2="0" stroke-width="1.2"/><line x1="0" y1="0" x2="200" y2="60" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="120" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="200" stroke-width="1.2"/><line x1="0" y1="0" x2="120" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="60" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="0" y2="200" stroke-width="1.2"/><path d="M20,0 Q15,15 0,20" stroke-width="0.8"/><path d="M45,0 Q35,35 0,45" stroke-width="0.9"/><path d="M75,0 Q55,55 0,75" stroke-width="1"/><path d="M110,0 Q80,80 0,110" stroke-width="1"/><path d="M150,0 Q105,105 0,150" stroke-width="1.1"/><path d="M195,0 Q130,130 0,195" stroke-width="1.2"/></svg>
  </div>
  <div class="web-container web-tr">
    <svg viewBox="0 0 200 200"><line x1="0" y1="0" x2="200" y2="0" stroke-width="1.2"/><line x1="0" y1="0" x2="200" y2="60" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="120" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="200" stroke-width="1.2"/><line x1="0" y1="0" x2="120" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="60" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="0" y2="200" stroke-width="1.2"/><path d="M20,0 Q15,15 0,20" stroke-width="0.8"/><path d="M45,0 Q35,35 0,45" stroke-width="0.9"/><path d="M75,0 Q55,55 0,75" stroke-width="1"/><path d="M110,0 Q80,80 0,110" stroke-width="1"/><path d="M150,0 Q105,105 0,150" stroke-width="1.1"/><path d="M195,0 Q130,130 0,195" stroke-width="1.2"/></svg>
  </div>
  <div class="web-container web-bl">
    <svg viewBox="0 0 200 200"><line x1="0" y1="0" x2="200" y2="0" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="80" stroke-width="0.9"/><line x1="0" y1="0" x2="200" y2="160" stroke-width="0.9"/><line x1="0" y1="0" x2="200" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="100" y2="200" stroke-width="0.9"/><line x1="0" y1="0" x2="0" y2="200" stroke-width="1"/><path d="M25,0 Q18,18 0,25" stroke-width="0.7"/><path d="M55,0 Q40,40 0,55" stroke-width="0.8"/><path d="M90,0 Q65,65 0,90" stroke-width="0.9"/><path d="M130,0 Q95,95 0,130" stroke-width="1"/><path d="M175,0 Q120,120 0,175" stroke-width="1"/></svg>
  </div>
  <div class="web-container web-br">
    <svg viewBox="0 0 200 200"><line x1="0" y1="0" x2="200" y2="0" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="80" stroke-width="0.9"/><line x1="0" y1="0" x2="200" y2="160" stroke-width="0.9"/><line x1="0" y1="0" x2="200" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="100" y2="200" stroke-width="0.9"/><line x1="0" y1="0" x2="0" y2="200" stroke-width="1"/><path d="M25,0 Q18,18 0,25" stroke-width="0.7"/><path d="M55,0 Q40,40 0,55" stroke-width="0.8"/><path d="M90,0 Q65,65 0,90" stroke-width="0.9"/><path d="M130,0 Q95,95 0,130" stroke-width="1"/><path d="M175,0 Q120,120 0,175" stroke-width="1"/></svg>
  </div>
  <div class="web-container web-ml">
    <svg viewBox="0 0 200 200"><line x1="0" y1="0" x2="200" y2="0" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="100" stroke-width="0.9"/><line x1="0" y1="0" x2="200" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="100" y2="200" stroke-width="0.9"/><line x1="0" y1="0" x2="0" y2="200" stroke-width="1"/><path d="M30,0 Q20,20 0,30" stroke-width="0.7"/><path d="M65,0 Q45,45 0,65" stroke-width="0.8"/><path d="M105,0 Q75,75 0,105" stroke-width="0.9"/><path d="M150,0 Q105,105 0,150" stroke-width="1"/><path d="M195,0 Q130,130 0,195" stroke-width="1"/></svg>
  </div>
  <div class="web-container web-mr">
    <svg viewBox="0 0 200 200"><line x1="0" y1="0" x2="200" y2="0" stroke-width="1"/><line x1="0" y1="0" x2="200" y2="100" stroke-width="0.9"/><line x1="0" y1="0" x2="200" y2="200" stroke-width="1"/><line x1="0" y1="0" x2="100" y2="200" stroke-width="0.9"/><line x1="0" y1="0" x2="0" y2="200" stroke-width="1"/><path d="M30,0 Q20,20 0,30" stroke-width="0.7"/><path d="M65,0 Q45,45 0,65" stroke-width="0.8"/><path d="M105,0 Q75,75 0,105" stroke-width="0.9"/><path d="M150,0 Q105,105 0,150" stroke-width="1"/><path d="M195,0 Q130,130 0,195" stroke-width="1"/></svg>
  </div>

  <div class="spider-thread" style="top:0; left:18%; height:clamp(40px, 8vh, 80px);"></div>

  <div class="spider" style="top:clamp(25px, 5vh, 55px); right:calc(22% - 10px); animation-delay:1.5s;">🕷️</div>

  <div class="bat" style="top:18%; left:15%; animation-delay:0s;">🦇</div>
  <div class="bat" style="top:28%; left:65%; animation-delay:2s;">🦇</div>
  <div class="bat" style="top:12%; left:78%; animation-delay:4s;">🦇</div>
  <div class="bat" style="top:32%; left:30%; animation-delay:1s;">🦇</div>

  <div class="ground-pumpkin" style="left:3%;">🎃</div>
  <div class="ground-pumpkin" style="left:20%;">🎃</div>
  <div class="ground-pumpkin" style="right:10%;">🎃</div>
  <div class="ground-pumpkin" style="right:25%;">🎃</div>

  <div id="floor"></div>

  <div id="ui-top">
    <div class="score-panel">
      <div class="label"><span class="pumpkin-icon">🎃</span><span>Счёт</span></div>
      <div class="value"><span class="pumpkin-big">🎃</span><span id="score">0</span></div>
    </div>
    <div class="progress-panel">
      <div class="label"><span class="pumpkin-icon">🎃</span><span>Прогресс</span></div>
      <div class="progress-bar-container"><div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div></div>
      <div class="progress-text"><span id="progress-text">0 / 10</span><span class="pumpkin-small"></span></div>
    </div>
  </div>

  <div id="game-title"><h1>ЛОВИ ДРАЖЕ!</h1></div>

  <div id="character">
    <svg class="character-svg" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <path d="M95 15 Q100 5 105 15 Q107 20 105 25 Q100 22 95 15" fill="#5d4037"/>
      <ellipse cx="115" cy="20" rx="18" ry="12" fill="#4caf50" transform="rotate(25 115 20)"/>
      <path d="M50 40 Q30 40 25 70 Q20 100 30 140 Q40 180 70 200 Q90 215 100 215 Q110 215 130 200 Q160 180 170 140 Q180 100 175 70 Q170 40 150 40 Q130 40 115 55 Q100 45 85 50 Q70 40 50 40" fill="url(#appleGradient)" stroke="#2e7d32" stroke-width="3"/>
      <defs><radialGradient id="appleGradient" cx="35%" cy="35%"><stop offset="0%" style="stop-color:#9ccc65"/><stop offset="50%" style="stop-color:#7cb342"/><stop offset="100%" style="stop-color:#558b2f"/></radialGradient></defs>
      <ellipse cx="75" cy="95" rx="22" ry="24" fill="white"/>
      <ellipse cx="125" cy="95" rx="22" ry="24" fill="white"/>
      <circle cx="78" cy="98" r="14" fill="#7e57c2"/>

      <circle cx="80" cy="96" r="7" fill="#1a0a2e"/><circle cx="82" cy="94" r="3" fill="white"/>
      <circle cx="130" cy="96" r="7" fill="#1a0a2e"/><circle cx="132" cy="94" r="3" fill="white"/>
      <path d="M55 135 Q60 125 75 130 Q100 120 125 130 Q140 125 145 135 Q150 150 140 170 Q120 190 100 185 Q80 190 60 170 Q50 150 55 135" fill="#4a1a6b" stroke="#2e1a47" stroke-width="2"/>
      <path d="M65 138 L70 152 L75 138 L80 152 L85 138 L90 152 L95 138 L100 152 L105 138 L110 152 L115 138 L120 152 L125 138 L130 152 L135 138" fill="white" stroke="#e0e0e0" stroke-width="1"/>
      <path d="M70 175 L73 165 L76 175 L79 165 L82 175 L85 165 L88 175 L91 165 L94 175 L97 165 L100 175 L103 165 L106 175 L109 165 L112 175 L115 165 L118 175 L121 165 L124 175" fill="white" stroke="#e0e0e0" stroke-width="1"/>
      <path d="M85 160 Q100 165 105 180 Q110 195 105 210 Q100 220 90 218 Q85 215 87 205 Q90 195 88 185 Q86 175 85 160" fill="#8e24aa" stroke="#6a1b9a" stroke-width="2"/>
      <ellipse cx="95" cy="190" rx="6" ry="10" fill="#ab47bc" opacity="0.6"/>
      <circle cx="70" cy="195" r="4" fill="#9ccc65" opacity="0.8"/>
      <circle cx="72" cy="205" r="3" fill="#9ccc65" opacity="0.7"/>
      <circle cx="130" cy="190" r="3.5" fill="#9ccc65" opacity="0.8"/>
      <ellipse cx="75" cy="222" rx="12" ry="6" fill="#689f38"/>

  <div id="mobile-controls">
    <div class="mobile-btn" id="btn-left">◀</div>
    <div class="mobile-btn" id="btn-right">▶</div>
  </div>

  <div id="controls">
    <button class="btn btn-icon" id="btn-sound" title="Звук">🔊</button>
    <button class="btn" id="btn-restart">🔄 Заново</button>
  </div>

  <div class="screen-flash" id="screen-flash"></div>

  <div id="overlay">
    <h2 id="overlay-title">🎉 Победа!</h2>
    <div class="result-text" id="overlay-text">Ты поймал все конфеты!</div>
    <button class="btn" id="btn-play-again">🎮 Играть снова</button>
  </div>

  <!-- СТАРТОВЫЙ ЭКРАН (без подзаголовка) -->
  <div id="start-overlay">
    <h2>ЛОВИ ДРАЖЕ!</h2>
    <button class="btn-start" id="btn-start">🎮 НАЧАТЬ ИГРУ</button>
  </div>
</div>

<script>
const state = {
  score: 0, target: 10, missed: 0, maxMisses: 5,
  playing: false, soundOn: true, charX: 0,
  candies: [], candySpeed: 2, spawnRate: 1500,
  lastSpawn: 0, keys: {}, animFrame: null, lastTime: 0,
  mobileLeft: false, mobileRight: false
};

let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!state.soundOn) return;
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'catch') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1047, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
    osc2.frequency.exponentialRampToValueAtTime(1319, audioCtx.currentTime + 0.2);
    gain2.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc2.start(audioCtx.currentTime + 0.1); osc2.stop(audioCtx.currentTime + 0.4);
  } else if (type === 'miss') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'win') {
    [523, 659, 784, 1047].forEach((freq, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + i * 0.15);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
      o.start(audioCtx.currentTime + i * 0.15);
      o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
    });
  }
}

const container = document.getElementById('game-container');
const character = document.getElementById('character');
const scoreEl = document.getElementById('score');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const screenFlash = document.getElementById('screen-flash');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');
const btnSound = document.getElementById('btn-sound');
const startOverlay = document.getElementById('start-overlay');
const btnStart = document.getElementById('btn-start');

function createStars() {
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 30; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    const size = (2 + Math.random() * 3) + 'px';
    star.style.width = size; star.style.height = size;
    starsEl.appendChild(star);
  }
}
createStars();

const candyColors = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink'];

function spawnCandy() {
  if (!state.playing) return;
  const candy = document.createElement('div');
  const color = candyColors[Math.floor(Math.random() * candyColors.length)];
  candy.className = `candy ${color}`;
  const containerWidth = container.offsetWidth;
  const candySize = 30;
  const startX = candySize + Math.random() * (containerWidth - candySize * 2);
  const drift = (Math.random() - 0.5) * 100;
  candy.style.left = startX + 'px';
  candy.style.top = '-40px';
  candy.dataset.x = startX; candy.dataset.y = -40;
  candy.dataset.drift = drift;
  candy.dataset.speed = state.candySpeed + Math.random() * 1.5;
  container.appendChild(candy);
  state.candies.push(candy);
}

function updateCharacter() {
  const containerWidth = container.offsetWidth;
  const speed = Math.max(6, containerWidth * 0.015);
  if (state.keys['ArrowLeft'] || state.keys['a'] || state.keys['ф'] || state.mobileLeft) state.charX -= speed;
  if (state.keys['ArrowRight'] || state.keys['d'] || state.keys['в'] || state.mobileRight) state.charX += speed;
  const charW = character.offsetWidth;
  state.charX = Math.max(0, Math.min(containerWidth - charW, state.charX));
  character.style.left = state.charX + 'px';
}

function checkCollision(candy) {
  const candyRect = candy.getBoundingClientRect();
  const charRect = character.getBoundingClientRect();
  const mouthX = charRect.left + charRect.width * 0.2;
  const mouthY = charRect.top + charRect.height * 0.3;
  const mouthW = charRect.width * 0.6;
  const mouthH = charRect.height * 0.4;
  return candyRect.left < mouthX + mouthW && candyRect.right > mouthX &&
         candyRect.top < mouthY + mouthH && candyRect.bottom > mouthY;
}

function showCatchEffect(x, y) {
  const effect = document.createElement('div');
  effect.className = 'catch-effect';
  effect.style.left = (x - 20) + 'px'; effect.style.top = (y - 20) + 'px';
  effect.innerHTML = '✨'; effect.style.fontSize = '35px';
  container.appendChild(effect);
  setTimeout(() => effect.remove(), 600);
  const text = document.createElement('div');
  text.className = 'catch-text';
  text.textContent = '+1 ';
  text.style.left = x + 'px'; text.style.top = (y - 25) + 'px';
  container.appendChild(text);
  setTimeout(() => text.remove(), 800);
}

function showMissEffect(x, y) {
  const text = document.createElement('div');
  text.className = 'miss-text';
  text.textContent = '✗';
  text.style.left = x + 'px'; text.style.top = y + 'px';
  container.appendChild(text);
  setTimeout(() => text.remove(), 800);
}

function flashScreen(type) {
  screenFlash.className = 'screen-flash ' + type;
  setTimeout(() => { screenFlash.className = 'screen-flash'; }, 300);
}

function updateUI() {
  scoreEl.textContent = state.score;
  const progress = Math.min(100, (state.score / state.target) * 100);
  progressBar.style.width = progress + '%';
  progressText.textContent = `${state.score} / ${state.target}`;
}

function endGame(won) {
  state.playing = false;
  cancelAnimationFrame(state.animFrame);
  if (won) {
    playSound('win');
    overlayTitle.textContent = '🎉 Победа!';
    overlayText.textContent = `Ты поймал ${state.score} конфет! Отлично! 🍬`;
    createConfetti();
  } else {
    overlayTitle.textContent = '😅 Попробуй ещё!';
    overlayText.textContent = `Поймано: ${state.score} из ${state.target}. Не сдавайся! 💪`;
  }
  setTimeout(() => { overlay.classList.add('show'); }, 500);
}

function createConfetti() {
  const colors = ['#ff8c00', '#4caf50', '#9c27b0', '#f44336', '#2196f3', '#cddc39', '#e91e63'];
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = '-20px';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confetti.style.width = (6 + Math.random() * 8) + 'px';
    confetti.style.height = (6 + Math.random() * 8) + 'px';
    confetti.style.animationDelay = Math.random() * 1 + 's';
    confetti.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    container.appendChild(confetti);
    setTimeout(() => confetti.remove(), 3500);
  }
}

function gameLoop(timestamp) {
  if (!state.playing) return;
  state.lastTime = timestamp;

  if (timestamp - state.lastSpawn > state.spawnRate) {
    spawnCandy();
    state.lastSpawn = timestamp;
    state.spawnRate = Math.max(600, state.spawnRate - 10);
    state.candySpeed = Math.min(5, state.candySpeed + 0.02);
  }

  updateCharacter();
  const containerHeight = container.offsetHeight;

  for (let i = state.candies.length - 1; i >= 0; i--) {
    const candy = state.candies[i];
    let y = parseFloat(candy.dataset.y);
    let x = parseFloat(candy.dataset.x);
    const drift = parseFloat(candy.dataset.drift);
    const speed = parseFloat(candy.dataset.speed);

    y += speed; x += drift * 0.02;
    candy.dataset.y = y; candy.dataset.x = x;
    candy.style.top = y + 'px'; candy.style.left = x + 'px';

    if (checkCollision(candy)) {
      state.score++; updateUI(); playSound('catch'); flashScreen('green');
      showCatchEffect(x + 15, y + 15);
      character.classList.remove('caught');
      void character.offsetWidth;
      character.classList.add('caught');
      candy.remove(); state.candies.splice(i, 1);
      if (state.score >= state.target) { endGame(true); return; }
      continue;
    }

    if (y > containerHeight - 80) {
      state.missed++; playSound('miss'); flashScreen('red');
      showMissEffect(x + 15, containerHeight - 100);
      character.classList.remove('missed');
      void character.offsetWidth;
      character.classList.add('missed');
      candy.remove(); state.candies.splice(i, 1);
      if (state.missed >= state.maxMisses) { endGame(false); return; }
    }
  }

  state.animFrame = requestAnimationFrame(gameLoop);
}

function startGame() {
  state.candies.forEach(c => c.remove());
  state.candies = []; state.score = 0; state.missed = 0;
  state.playing = true; state.spawnRate = 1500; state.candySpeed = 2;
  state.lastSpawn = 0; state.lastTime = performance.now();
  const containerWidth = container.offsetWidth;
  state.charX = (containerWidth - character.offsetWidth) / 2;
  character.style.left = state.charX + 'px';
  overlay.classList.remove('show');
  updateUI();
  cancelAnimationFrame(state.animFrame);
  state.animFrame = requestAnimationFrame(gameLoop);
}

// ===== ЗАПУСК ИГРЫ — несколько способов для надёжности =====
function launchGame() {
  if (startOverlay.classList.contains('hidden')) return;
  initAudio();
  startOverlay.classList.add('hidden');
  startGame();
}

// click
btnStart.addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  launchGame();
});

// touchend (для мобильных — срабатывает раньше click)
btnStart.addEventListener('touchend', function(e) {
  e.preventDefault();
  e.stopPropagation();
  launchGame();
}, { passive: false });

// mousedown (резерв)
btnStart.addEventListener('mousedown', function(e) {
  e.preventDefault();
  e.stopPropagation();
});

// Клавиатура — Enter или пробел
document.addEventListener('keydown', function(e) {
  if ((e.key === 'Enter' || e.key === ' ') && !startOverlay.classList.contains('hidden')) {
    e.preventDefault();
    launchGame();
  }
  state.keys[e.key] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', (e) => { state.keys[e.key] = false; });

// Управление персонажем
let isDragging = false;
container.addEventListener('mousedown', (e) => {
  if (e.target.closest('.btn') || e.target.closest('.btn-start') || e.target.closest('#mobile-controls') || e.target.closest('#start-overlay')) return;
  isDragging = true; initAudio();
});
container.addEventListener('mousemove', (e) => {
  if (!isDragging || !state.playing) return;
  const rect = container.getBoundingClientRect();
  state.charX = e.clientX - rect.left - character.offsetWidth / 2;
});
container.addEventListener('mouseup', () => { isDragging = false; });
container.addEventListener('mouseleave', () => { isDragging = false; });

container.addEventListener('touchstart', (e) => {
  if (e.target.closest('.btn') || e.target.closest('.btn-start') || e.target.closest('#mobile-controls') || e.target.closest('#start-overlay')) return;
  isDragging = true; initAudio();
}, { passive: true });
container.addEventListener('touchmove', (e) => {
  if (!isDragging || !state.playing) return;
  e.preventDefault();
  const rect = container.getBoundingClientRect();
  state.charX = e.touches[0].clientX - rect.left - character.offsetWidth / 2;
}, { passive: false });
container.addEventListener('touchend', () => { isDragging = false; });

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); state.mobileLeft = true; initAudio(); }, { passive: false });
btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); state.mobileLeft = false; }, { passive: false });
btnLeft.addEventListener('mousedown', () => { state.mobileLeft = true; initAudio(); });
btnLeft.addEventListener('mouseup', () => { state.mobileLeft = false; });
btnLeft.addEventListener('mouseleave', () => { state.mobileLeft = false; });
btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); state.mobileRight = true; initAudio(); }, { passive: false });
btnRight.addEventListener('touchend', (e) => { e.preventDefault(); state.mobileRight = false; }, { passive: false });
btnRight.addEventListener('mousedown', () => { state.mobileRight = true; initAudio(); });
btnRight.addEventListener('mouseup', () => { state.mobileRight = false; });
btnRight.addEventListener('mouseleave', () => { state.mobileRight = false; });

btnSound.addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  btnSound.textContent = state.soundOn ? '🔊' : '🔇';
  if (state.soundOn) initAudio();
});

document.getElementById('btn-restart').addEventListener('click', () => { initAudio(); startGame(); });
document.getElementById('btn-play-again').addEventListener('click', () => { initAudio(); startGame(); });

window.addEventListener('resize', () => {
  const containerWidth = container.offsetWidth;
  state.charX = Math.min(state.charX, containerWidth - character.offsetWidth);
  character.style.left = state.charX + 'px';
});

document.addEventListener('touchmove', (e) => {
  if (e.target.closest('#game-container') && !e.target.closest('.btn-start')) {
    e.preventDefault();
  }
}, { passive: false });
</script>

</body>
